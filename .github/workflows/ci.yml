name: ci

on:
  push:
    branches: [main]
  pull_request:

# actions/checkout and actions/setup-go are pinned to a commit SHA, each
# verified against the upstream repository's own tags at the time this
# file was written (git ls-remote --tags), never copied from a digest
# found elsewhere. Re-verify and re-pin rather than editing the version
# comment alone.
jobs:
  unit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: gofmt -l .
      - run: go test ./...
      - run: go test -race ./...

  integration-2022:
    env:
      ASQ_TEST_RUN_ID: asq-${{ github.run_id }}-${{ github.run_attempt }}-2022
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: tests/integration against SQL Server 2022
        env:
          ASQ_TEST_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
        run: sh tests/integration/run.sh go test ./tests/integration -tags=integration -count=1 -timeout=25m -v
      - name: remove this run's remaining containers
        if: always()
        run: make integration-cleanup

  integration-2019:
    env:
      ASQ_TEST_RUN_ID: asq-${{ github.run_id }}-${{ github.run_attempt }}-2019
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: tests/integration against SQL Server 2019
        env:
          ASQ_TEST_IMAGE: mcr.microsoft.com/mssql/server:2019-latest
        run: sh tests/integration/run.sh go test ./tests/integration -tags=integration -count=1 -timeout=25m -v
      - name: remove this run's remaining containers
        if: always()
        run: make integration-cleanup

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - name: build the Windows binary
        run: go build -trimpath -o asq.exe ./cmd/asq
      - name: "smoke: help works with no configuration file"
        run: .\asq.exe help
      - name: "smoke: a missing --config reports a config error, not a crash"
        # cmd, not pwsh, and the choice is deliberate. This step asserts a
        # NON-ZERO exit code, which is the one thing PowerShell makes hard:
        # GitHub Actions runs pwsh with $ErrorActionPreference = 'Stop', and
        # PowerShell 7.3 and later turn a native command's non-zero exit
        # into a terminating error under that preference, so the script dies
        # on the asq.exe call and never reaches its own comparison. Measured
        # twice on this runner: the binary printed its correct message and
        # returned 2, while the step reported 1 from a branch it had not
        # run, and standing both preferences down did not change that. cmd
        # has no such semantics and %ERRORLEVEL% is exactly the child's
        # code, so the assertion can be read literally.
        shell: cmd
        run: |
          .\asq.exe --ctx x --config .\does-not-exist.yaml info
          if %ERRORLEVEL% NEQ 2 (
            echo expected exit code 2 for a missing config file, got %ERRORLEVEL%
            exit /b 1
          )
          exit /b 0
